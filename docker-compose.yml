services:
  db:
    image: postgres
    environment:
      - POSTGRES_DB=${DB}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - linexnet
  web:
    build: .
    ports:
      - 7000
    depends_on:
      - db
    networks:
      - linexnet
    environment:
      - DJANGO_SETTINGS_MODULE=lipid_network_project.settings.production
      - POSTGRES_DB=${DB}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCRIPT_NAME=${SCRIPT_NAME}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    volumes:
      - static_volume:/webapp/lipid_network_project/static
      - media_volume:/webapp/lipid_network_project/media
  nginx:
    image: nginx:latest
    ports:
      - 8084:80
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/data/linex/static
      - media_volume:/data/linex/media
    networks:
      - linexnet

networks:
  linexnet:

volumes:
  static_volume:
  media_volume:
